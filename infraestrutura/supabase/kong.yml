_format_version: "3.0"
services:
  - name: auth-v1
    url: http://supabase-auth:9999
    routes:
      - name: auth-v1-all
        paths:
          - /auth/v1
  - name: rest-v1
    url: http://supabase-rest:3000
    routes:
      - name: rest-v1-all
        paths:
          - /rest/v1
  - name: studio
    url: http://supabase-studio:3000
    routes:
      - name: studio-all
        paths:
          - /
